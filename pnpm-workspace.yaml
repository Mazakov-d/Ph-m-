packages:
  - "apps/*"
  - "packages/*"

# Build steps allowed to run on install (file watcher, module resolver, Prisma engines,
# argon2 native binding, esbuild binary used by tsx, ffmpeg binary).
allowBuilds:
  argon2: true
  esbuild: true
  "@prisma/engines": true
  prisma: true
  "@parcel/watcher": true
  unrs-resolver: true
  # Downloads the ffmpeg binary used to clean and convert videos (docs/DECISIONS.md).
  ffmpeg-static: true

# Auto-installed peers must match the versions bundled with Expo SDK 57 / React Native 0.86.
overrides:
  "@react-native/metro-config": 0.86.3
  react-native-worklets: 0.10.1
