services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fama
      POSTGRES_PASSWORD: fama
      POSTGRES_DB: fama
    ports:
      # Host port 5434 avoids clashing with a PostgreSQL already running on 5432.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fama -d fama"]
      interval: 5s
      timeout: 5s
      retries: 10

  # docs/DECISIONS.md: S3-compatible private storage for editor identity documents
  # (RustFS, as MinIO no longer publishes free images). Never exposed publicly.
  storage:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: fama
      RUSTFS_SECRET_KEY: fama-dev-secret
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
