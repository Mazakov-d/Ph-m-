services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fama
      POSTGRES_PASSWORD: fama
      POSTGRES_DB: fama
    ports:
      # Host port 5434 avoids clashing with a PostgreSQL already running on 5432.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fama -d fama"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
